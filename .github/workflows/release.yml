name: Create Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  actions: read

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      ACTIONS_FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Latest Changelog Entry
        shell: pwsh
        run: |
          $content = Get-Content -Path "CHANGELOG.md" -Raw
          if ($content -match '(?ms)(##\s*\[?v?[\d\.]+.*?)(?=\r?\n##\s|\Z)') {
              $matches[1].Trim() | Out-File -FilePath "release_notes.md" -Encoding utf8
          } else {
              Write-Warning "Could not parse CHANGELOG.md."
              New-Item -ItemType File -Path "release_notes.md" -Force
          }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish with Publish Profile
        run: |
          dotnet publish TinyNvidiaUpdateChecker/TinyNvidiaUpdateChecker.csproj `
            -c Release `
            /p:PublishProfile=FolderProfile `
            -o ./publish

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinyNvidiaUpdateChecker-unsigned
          path: ./publish/TinyNvidiaUpdateChecker.exe
          if-no-files-found: error

      - name: Sign with SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: './signed'

      - name: Verify signature
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature ./signed/TinyNvidiaUpdateChecker.exe
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate) {
              throw "TinyNvidiaUpdateChecker.exe is not signed."
          }

      - name: Upload to VirusTotal
        id: virustotal
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ./signed/TinyNvidiaUpdateChecker.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: TinyNvidiaUpdateChecker ${{ github.ref_name }}
          files: ./signed/TinyNvidiaUpdateChecker.exe
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
